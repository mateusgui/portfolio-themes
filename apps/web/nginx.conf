server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Regras de headers da Cloudflare (aplicadas só lá): não é um arquivo público.
  location = /_headers {
    return 404;
  }

  # Assets com hash no nome: cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota cai no index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
