<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, Open Graph, hreflang e JSON-LD: gerados no build (scripts/seo). -->
    <!-- seo -->
    <!--
      Roda antes da pintura para não piscar outro tema. Tema: ?tema= > escolha
      salva > prefers-color-scheme (escuro abre VS Code). ?tema= e ?lang= válidos,
      e as páginas de idioma (/pt/, /en/, /es/), contam como escolha manual: são
      salvos e saem da URL. As chaves, os ids e os caminhos precisam bater com
      src/themes/registry.ts e src/i18n/languages.ts.
    -->
    <script>
      (function () {
        var THEMES = ['hacker', 'retro', 'minimal', 'vscode', 'paper'];
        var LANGUAGES = ['pt-BR', 'en', 'es'];
        var LANGUAGE_PATHS = { '/pt/': 'pt-BR', '/en/': 'en', '/es/': 'es' };
        var storage = null;
        try {
          storage = window.localStorage;
        } catch (error) {
          // localStorage bloqueado: segue sem persistir.
        }
        function read(key) {
          try {
            return storage ? storage.getItem(key) : null;
          } catch (error) {
            return null;
          }
        }
        function save(key, value) {
          try {
            if (storage) storage.setItem(key, value);
          } catch (error) {
            // Sem armazenamento, vale só para esta visita.
          }
        }

        var url = new URL(window.location.href);
        var pathLang = LANGUAGE_PATHS[url.pathname.replace(/\/?$/, '/')] || null;
        var queryTheme = url.searchParams.get('tema');
        var queryLang = url.searchParams.get('lang');
        if (THEMES.indexOf(queryTheme) !== -1) save('portfolio:theme', queryTheme);
        // ?lang= vence o caminho quando os dois aparecem.
        if (LANGUAGES.indexOf(queryLang) !== -1) save('portfolio:lang', queryLang);
        else if (pathLang) save('portfolio:lang', pathLang);
        if (pathLang || url.searchParams.has('tema') || url.searchParams.has('lang')) {
          url.searchParams.delete('tema');
          url.searchParams.delete('lang');
          var path = pathLang ? '/' : url.pathname;
          history.replaceState(history.state, '', path + url.search + url.hash);
        }

        var theme = THEMES.indexOf(queryTheme) !== -1 ? queryTheme : read('portfolio:theme');
        if (THEMES.indexOf(theme) === -1) {
          var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
          theme = dark ? 'vscode' : 'minimal';
        }
        document.documentElement.dataset.theme = theme;

        // Chunk dos slots do tema (o app espera por ele antes do primeiro render):
        // pedido já aqui, em paralelo com o JS principal. Mapa preenchido no build.
        var THEME_CHUNKS = /* theme-chunks */ {};
        if (THEME_CHUNKS[theme]) {
          var preload = document.createElement('link');
          preload.rel = 'modulepreload';
          preload.href = THEME_CHUNKS[theme];
          document.head.appendChild(preload);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
